name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (例: v2.5.0)。空なら最新の draft/published release を使用"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(gh release list --limit 20 --json tagName,isDraft,isLatest \
              --jq '[.[] | select(.tagName|startswith("v"))] | (map(select(.isDraft==false)) + map(select(.isDraft==true))) | .[0].tagName')
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish single-file exe
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .\publish-sf -ErrorAction SilentlyContinue
          dotnet publish .\KeyAutomator.csproj `
            -c Release `
            -p:Platform=x64 `
            -r win-x64 `
            --self-contained true `
            -o .\publish-sf

      - name: Pack single-file zip
        id: pack_single
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.name }}"
          $ver = $tag.TrimStart('v')
          $distName = "KeyAutomator-v$ver-win-x64-single"
          $distDir = ".\dist\$distName"
          Remove-Item -Recurse -Force .\dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item -Force .\publish-sf\KeyAutomator.exe $distDir\
          foreach ($f in @("config.sample.json", "使い方.txt", "README.md", "PRIVACY.md")) {
            if (Test-Path $f) { Copy-Item -Force $f $distDir\ }
          }
          $zipPath = ".\dist\$distName.zip"
          Compress-Archive -Path $distDir -DestinationPath $zipPath -Force
          "zip=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $zipPath | Format-List FullName, Length

      - name: Create signing certificate (MSIX)
        shell: pwsh
        run: |
          if (-not (Test-Path .\scripts\ci\New-CiSigningCertificate.ps1)) {
            throw "scripts/ci/New-CiSigningCertificate.ps1 がありません（このタグに MSIX リリース手順が含まれる必要があります）"
          }
          .\scripts\ci\New-CiSigningCertificate.ps1 `
            -PfxPath .\KeyAutomator_CI.pfx `
            -CerPath .\KeyAutomator_CI.cer `
            -ThumbprintPath .\KeyAutomator_CI.thumbprint `
            -Password "KeyAutomator-CI-Temp!"

      - name: Build MSIX (sideload)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "KeyAutomatorMsixRelease"
          .\scripts\ci\Build-MsixSideload.ps1 `
            -Configuration Release `
            -Platform x64 `
            -PfxPath .\KeyAutomator_CI.pfx `
            -CerPath .\KeyAutomator_CI.cer `
            -ThumbprintPath .\KeyAutomator_CI.thumbprint `
            -Password "KeyAutomator-CI-Temp!" `
            -OutDir $out
          $pathFile = Join-Path $out "msix-path.txt"
          if (-not (Test-Path $pathFile)) { throw "msix-path.txt がありません" }
          $msix = (Get-Content -LiteralPath $pathFile -Raw).Trim()
          if (-not $msix -or -not (Test-Path -LiteralPath $msix)) { throw "MSIX が見つかりません: $msix" }
          "MSIX_PATH=$msix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item -LiteralPath $msix | Format-List FullName, Length, LastWriteTime

      - name: Pack MSIX zip
        id: pack_msix
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.name }}"
          $ver = $tag.TrimStart('v')
          $distName = "KeyAutomator-v$ver-win-x64-msix"
          $distDir = ".\dist\$distName"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $msixDest = Join-Path $distDir "KeyAutomator-v$ver-win-x64.msix"
          Copy-Item -Force $env:MSIX_PATH $msixDest
          Copy-Item -Force .\KeyAutomator_CI.cer (Join-Path $distDir "KeyAutomator-v$ver-signing.cer")

          $template = Get-Content -LiteralPath .\scripts\ci\MsixInstallReadme.template.txt -Raw -Encoding utf8
          $readme = $template.Replace('__VERSION__', $ver)
          Set-Content -LiteralPath (Join-Path $distDir "MSIXの入れ方.txt") -Value $readme -Encoding utf8

          foreach ($f in @("README.md", "PRIVACY.md", "使い方.txt")) {
            if (Test-Path $f) { Copy-Item -Force $f $distDir\ }
          }

          $zipPath = ".\dist\$distName.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path $distDir -DestinationPath $zipPath -Force
          "zip=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $zipPath | Format-List FullName, Length

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          upload() {
            local ZIP="$1"
            local NAME
            NAME="$(basename "$ZIP")"
            EXISTING=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name==\"$NAME\") | .id" || true)
            if [ -n "$EXISTING" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$EXISTING"
            fi
            gh release upload "$TAG" "$ZIP" --clobber
            echo "Uploaded: $NAME"
          }
          upload "${{ steps.pack_single.outputs.zip }}"
          upload "${{ steps.pack_msix.outputs.zip }}"

      - name: Cleanup cert files
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force .\KeyAutomator_CI.pfx, .\KeyAutomator_CI.cer, .\KeyAutomator_CI.thumbprint -ErrorAction SilentlyContinue
