name: MSIX Sideload Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix-sideload-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 注: WinUI テストプロジェクトは CI 上の SDK / VSTest 組み合わせが不安定なため、
      # このワークフローでは MSIX インストール通しを主検証とする。

      - name: Create CI signing certificate
        shell: pwsh
        run: |
          .\scripts\ci\New-CiSigningCertificate.ps1 `
            -PfxPath .\KeyAutomator_CI.pfx `
            -CerPath .\KeyAutomator_CI.cer `
            -ThumbprintPath .\KeyAutomator_CI.thumbprint `
            -Password "KeyAutomator-CI-Temp!"

      - name: Build MSIX (sideload)
        id: build
        shell: pwsh
        run: |
          .\scripts\ci\Build-MsixSideload.ps1 `
            -Configuration Release `
            -Platform x64 `
            -PfxPath .\KeyAutomator_CI.pfx `
            -CerPath .\KeyAutomator_CI.cer `
            -ThumbprintPath .\KeyAutomator_CI.thumbprint `
            -Password "KeyAutomator-CI-Temp!" `
            -OutDir .\AppPackages\CI
          $pathFile = ".\AppPackages\CI\msix-path.txt"
          if (-not (Test-Path $pathFile)) { throw "msix-path.txt がありません" }
          $msix = (Get-Content -LiteralPath $pathFile -Raw).Trim()
          if (-not $msix -or -not (Test-Path -LiteralPath $msix)) { throw "MSIX が見つかりません: $msix" }
          "msix=$msix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item -LiteralPath $msix | Format-List FullName, Length

      - name: Install and smoke-test MSIX
        shell: pwsh
        run: |
          .\scripts\ci\Smoke-MsixSideload.ps1 `
            -MsixPath "${{ steps.build.outputs.msix }}" `
            -CerPath .\KeyAutomator_CI.cer `
            -Password "KeyAutomator-CI-Temp!"

      - name: Summarize package outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .\AppPackages\CI) {
            Get-ChildItem .\AppPackages\CI -Recurse -File |
              Sort-Object Length -Descending |
              Select-Object -First 30 FullName, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} |
              Format-Table -AutoSize | Out-String | Write-Host
          }

      # 巨大な self-contained MSIX のアップロードは runner を長時間占有し得るため、
      # 成功時のみ・保持短縮で上げる。失敗時はログと CER のみ。
      - name: Upload MSIX artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KeyAutomator-msix-sideload
          path: |
            AppPackages/CI/**/*.msix
            AppPackages/CI/**/*.msixbundle
            KeyAutomator_CI.cer
          if-no-files-found: warn
          retention-days: 5
          compression-level: 0

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KeyAutomator-msix-diagnostics
          path: |
            AppPackages/CI/**/msbuild-msix.log
            AppPackages/CI/**/msix-path.txt
            KeyAutomator_CI.cer
          if-no-files-found: warn
          retention-days: 5

      - name: Cleanup cert files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .\KeyAutomator_CI.thumbprint) {
            $tp = (Get-Content .\KeyAutomator_CI.thumbprint -Raw).Trim()
            Get-ChildItem Cert:\CurrentUser\My |
              Where-Object { $_.Thumbprint -eq $tp } |
              ForEach-Object { Remove-Item $_.PSPath -Force -ErrorAction SilentlyContinue }
          }
          Remove-Item -Force .\KeyAutomator_CI.pfx -ErrorAction SilentlyContinue
          Remove-Item -Force .\KeyAutomator_CI.cer -ErrorAction SilentlyContinue
          Remove-Item -Force .\KeyAutomator_CI.thumbprint -ErrorAction SilentlyContinue
