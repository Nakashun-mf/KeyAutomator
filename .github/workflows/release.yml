name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (例: v2.5.0)。空なら最新の draft/published release を使用"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(gh release list --limit 20 --json tagName,isDraft,isLatest \
              --jq '[.[] | select(.tagName|startswith("v"))] | (map(select(.isDraft==false)) + map(select(.isDraft==true))) | .[0].tagName')
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file exe
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .\publish-sf -ErrorAction SilentlyContinue
          dotnet publish .\KeyAutomator.csproj `
            -c Release `
            -p:Platform=x64 `
            -r win-x64 `
            --self-contained true `
            -o .\publish-sf

      - name: Pack zip
        id: pack
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.name }}"
          $ver = $tag.TrimStart('v')
          $distName = "KeyAutomator-v$ver-win-x64-single"
          $distDir = ".\dist\$distName"
          Remove-Item -Recurse -Force .\dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item -Force .\publish-sf\KeyAutomator.exe $distDir\
          if (Test-Path .\config.sample.json) {
            Copy-Item -Force .\config.sample.json $distDir\
          }
          if (Test-Path .\使い方.txt) {
            Copy-Item -Force .\使い方.txt $distDir\
          }
          if (Test-Path .\README.md) {
            Copy-Item -Force .\README.md $distDir\
          }
          if (Test-Path .\PRIVACY.md) {
            Copy-Item -Force .\PRIVACY.md $distDir\
          }
          $zipPath = ".\dist\$distName.zip"
          Compress-Archive -Path $distDir -DestinationPath $zipPath -Force
          echo "zip=$zipPath" >> $env:GITHUB_OUTPUT
          echo "asset=$distName.zip" >> $env:GITHUB_OUTPUT
          Get-Item $zipPath | Format-List FullName, Length

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          ZIP="${{ steps.pack.outputs.zip }}"
          # 既存同名アセットがあれば削除して差し替え
          EXISTING=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name==\"$(basename "$ZIP")\") | .id" || true)
          if [ -n "$EXISTING" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$EXISTING"
          fi
          gh release upload "$TAG" "$ZIP" --clobber
