name: MSIX Sideload Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 巨大成果物アップロード等で runner が落ちた前ジョブを打ち切る
concurrency:
  group: msix-sideload-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msix-sideload-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 注: WinUI テストプロジェクトは CI 上の SDK / VSTest 組み合わせが不安定なため、
      # このワークフローでは MSIX インストール通しを主検証とする。

      - name: Create CI signing certificate
        shell: pwsh
        run: |
          .\scripts\ci\New-CiSigningCertificate.ps1 `
            -PfxPath .\KeyAutomator_CI.pfx `
            -CerPath .\KeyAutomator_CI.cer `
            -ThumbprintPath .\KeyAutomator_CI.thumbprint `
            -Password "KeyAutomator-CI-Temp!"

      - name: Build MSIX (sideload)
        shell: pwsh
        run: |
          .\scripts\ci\Build-MsixSideload.ps1 `
            -Configuration Release `
            -Platform x64 `
            -PfxPath .\KeyAutomator_CI.pfx `
            -CerPath .\KeyAutomator_CI.cer `
            -ThumbprintPath .\KeyAutomator_CI.thumbprint `
            -Password "KeyAutomator-CI-Temp!" `
            -OutDir .\AppPackages\CI
          $pathFile = ".\AppPackages\CI\msix-path.txt"
          if (-not (Test-Path $pathFile)) { throw "msix-path.txt がありません" }
          $msix = (Get-Content -LiteralPath $pathFile -Raw).Trim()
          if (-not $msix -or -not (Test-Path -LiteralPath $msix)) { throw "MSIX が見つかりません: $msix" }
          Get-Item -LiteralPath $msix | Format-List FullName, Length, LastWriteTime

      - name: Install and smoke-test MSIX
        shell: pwsh
        run: |
          $pathFile = ".\AppPackages\CI\msix-path.txt"
          $msix = (Get-Content -LiteralPath $pathFile -Raw).Trim()
          Write-Host "Smoke target: $msix"
          try {
            .\scripts\ci\Smoke-MsixSideload.ps1 `
              -MsixPath $msix `
              -CerPath .\KeyAutomator_CI.cer `
              -Password "KeyAutomator-CI-Temp!"
            "SMOKE PASSED" | Set-Content -LiteralPath .\AppPackages\CI\smoke-result.txt
          }
          catch {
            $_ | Out-String | Set-Content -LiteralPath .\AppPackages\CI\smoke-result.txt
            throw
          }

      - name: Summarize package outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .\AppPackages\CI) {
            Get-ChildItem .\AppPackages\CI -Recurse -File |
              Sort-Object Length -Descending |
              Select-Object -First 30 FullName, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} |
              Format-Table -AutoSize | Out-String | Write-Host
          }
          if (Test-Path .\AppPackages\CI\smoke-result.txt) {
            Write-Host "----- smoke-result.txt -----"
            Get-Content .\AppPackages\CI\smoke-result.txt | ForEach-Object { Write-Host $_ }
          }

      # Artifact アップロードはこの環境で runner 切断／ハングの原因になるため行わない。
      # 診断内容は上の Summarize ステップでログへ出す。

      - name: Cleanup cert files
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          # 証明書ストア列挙は環境によって止まることがあるため、ファイルだけ消す
          Remove-Item -Force .\KeyAutomator_CI.pfx, .\KeyAutomator_CI.cer, .\KeyAutomator_CI.thumbprint -ErrorAction SilentlyContinue
